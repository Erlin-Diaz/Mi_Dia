<!doctype html>
<html lang="es">

<head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tu día</title>
    <script>
        // Aplica el tema guardado antes de pintar, para evitar el parpadeo
        // del tema equivocado al cargar la página. Se mantiene inline (en
        // vez de en js/app.js) a propósito: tiene que ejecutarse antes de
        // que se pinte la página, y un <script type="module" src="…">
        // externo se cargaría demasiado tarde para eso.
        (function () {
            try {
                var t = localStorage.getItem("tu-dia-theme");
                if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>

    <div class="page">
        <div class="page__tools">
            <button type="button" id="settingsToggle" class="icon-btn" aria-label="Ajustes de sincronización"
                title="Ajustes de sincronización" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span class="icon-btn__dot" id="settingsDot"></span>
            </button>
            <button type="button" id="themeToggle" class="icon-btn" aria-label="Cambiar tema" title="Cambiar tema"></button>
        </div>
        <header>
            <div class="header__text">
                <p class="eyebrow" id="greeting">Buenos días</p>
                <h1 class="date-heading" id="dateHeading">—</h1>
                <p class="day-name" id="dayName">—</p>
            </div>
            <div class="dial-row">
                <div class="dial" id="dial"></div>
                <span class="dial__count" id="progressCount">0/0</span>
            </div>
        </header>

        <div class="sync-row" id="syncRow" hidden>
            <span class="sync-status"><span class="sync-dot" id="syncDot"></span><span
                    id="syncLabel">Conectando…</span></span>
            <span>Código: <code id="syncCodeText">—</code></span>
            <span class="sync-actions">
                <button type="button" id="copyCodeBtn">Copiar código</button>
                <button type="button" id="joinCodeBtn">Usar otro código</button>
            </span>
            <span class="sync-error-note" id="syncErrorNote" hidden></span>
        </div>

        <section class="tasks">
            <form class="add-row" id="addForm">
                <input type="text" id="taskInput" placeholder="Añade algo para hoy…" autocomplete="off"
                    maxlength="140" />
                <input type="time" id="timeInput" autocomplete="off" />
                <button type="submit">Añadir</button>
            </form>
            <ul class="task-list" id="taskList"></ul>
            <p class="empty-state" id="emptyState">Nada pendiente todavía. Empieza por lo primero que se te ocurra.</p>
            <p class="day-complete" id="dayComplete">🎉&nbsp; ¡Completaste todas tus tareas de hoy!</p>
        </section>

        <section class="someday">
            <span class="section-label">Algún día</span>
            <form class="add-row" id="somedayAddForm">
                <input type="text" id="somedayInput" placeholder="Algo para anotar, sin fecha…" autocomplete="off"
                    maxlength="140" />
                <button type="submit">Añadir</button>
            </form>
            <ul class="task-list" id="somedayTaskList"></ul>
            <p class="empty-state" id="somedayEmptyState">Nada por acá todavía.</p>
        </section>

        <footer class="page__footer">
            <div class="footer__group">
                <button class="ghost-btn" id="importBtn" type="button"
                    title="Cargar tareas y notas desde un archivo exportado">Importar</button>
                <button class="ghost-btn" id="exportBtn" type="button"
                    title="Descargar tus tareas y notas en un archivo, como respaldo">Exportar</button>
                <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
            </div>
            <button class="ghost-btn" id="clearDone" type="button">Borrar completadas</button>
        </footer>
    </div>

    <script type="module" src="./js/app.js"></script>

</body>

</html>
