<!doctype html>
<html lang="es">

<head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tu día</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: light-dark(#ECEDF2, #14151C);
            --surface: light-dark(#FFFFFF, #1B1D26);
            --ink: light-dark(#1C1E2A, #E8E9EF);
            --ink-soft: light-dark(#5B5E70, #9699AC);
            --ink-faint: light-dark(#9498A8, #565A6E);
            --line: light-dark(#DCDDE5, #292B38);
            --accent: light-dark(#A8752A, #E7B65C);
            --urgent: light-dark(#B23B33, #E2897E);
            --ok: light-dark(#3B7D4F, #7FCB94);
            --radius: 4px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background:
                radial-gradient(480px 320px at 88% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent),
                var(--bg);
            color: var(--ink);
            font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 6vh 20px;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 14px 34px -20px rgb(0 0 0 / 0.35);
            padding: 44px 40px 36px;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .header__text {
            min-width: 0;
        }

        .eyebrow {
            margin: 0 0 6px;
            font-size: 0.72rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            color: var(--ink-soft);
            font-weight: 600;
            font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
        }

        .date-heading {
            margin: 0;
            font-weight: 800;
            font-size: clamp(1.9rem, 6.4vw, 2.5rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }

        .day-name {
            margin: 5px 0 0;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--ink-soft);
            text-transform: capitalize;
        }

        .dial-row {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding-top: 2px;
        }

        .dial {
            --pct: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0);
            position: relative;
        }

        .dial::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 50%;
            background: var(--surface);
        }

        .dial__count {
            font-family: ui-monospace, monospace;
            font-variant-numeric: tabular-nums;
            font-size: 0.72rem;
            color: var(--ink-soft);
        }

        .sync-row {
            margin-top: 18px;
            padding: 10px 12px;
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--ink-soft);
        }

        .sync-row code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: ui-monospace, monospace;
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink-faint);
            flex-shrink: 0;
        }

        .sync-dot.ok {
            background: var(--ok);
        }

        .sync-dot.err {
            background: var(--urgent);
        }

        .sync-actions {
            display: flex;
            gap: 10px;
        }

        .sync-actions button {
            border: none;
            background: none;
            color: var(--ink-soft);
            text-decoration: underline;
            text-decoration-color: var(--line);
            cursor: pointer;
            font-size: 0.78rem;
            font-family: inherit;
            padding: 0;
        }

        .sync-actions button:hover {
            color: var(--accent);
            text-decoration-color: var(--accent);
        }

        .tasks {
            margin-top: 30px;
        }

        .add-row {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 14px;
            margin-bottom: 6px;
        }

        .add-row input[type="text"] {
            border: none;
            background: transparent;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.98rem;
            padding: 6px 2px;
            outline: none;
        }

        #taskInput {
            flex: 1;
            min-width: 0;
        }

        #timeInput {
            width: 78px;
            flex-shrink: 0;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--ink-soft);
            border-left: 1px solid var(--line);
            padding-left: 10px;
        }

        .add-row input::placeholder {
            color: var(--ink-faint);
        }

        .add-row button {
            border: none;
            background: var(--ink);
            color: var(--surface);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 0 16px;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .task-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }

        .task__box-wrap {
            flex-shrink: 0;
            align-self: stretch;
            display: flex;
            align-items: center;
            padding: 4px;
            margin: -4px 0 -4px -4px;
            cursor: pointer;
        }

        .task__box {
            appearance: none;
            -webkit-appearance: none;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--ink-faint);
            border-radius: 2px;
            display: grid;
            place-content: center;
            cursor: pointer;
            margin: 0;
            pointer-events: none;
        }

        .task__box::after {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--accent);
            clip-path: polygon(14% 44%, 0 63%, 39% 100%, 100% 16%, 84% 0%, 37% 71%);
            opacity: 0;
            transform: scale(0.6);
        }

        .task__box:checked {
            border-color: var(--accent);
        }

        .task__box:checked::after {
            opacity: 1;
            transform: scale(1);
        }

        .task__text {
            flex: 1;
            min-width: 0;
            font-size: 1rem;
            line-height: 1.35;
            word-break: break-word;
        }

        .task--done .task__text {
            color: var(--ink-faint);
            text-decoration: line-through;
        }

        .task--priority:not(.task--done) .task__text::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--urgent);
            margin-right: 8px;
            vertical-align: middle;
        }

        .task__time {
            flex-shrink: 0;
            font-family: ui-monospace, monospace;
            font-size: 0.78rem;
            color: var(--ink-soft);
        }

        .task--done .task__time {
            color: var(--ink-faint);
        }

        .task__actions {
            display: flex;
            flex-shrink: 0;
            margin-right: -8px;
        }

        .task__star,
        .task__del {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95rem;
            line-height: 1;
            padding: 8px;
            color: var(--ink-faint);
            opacity: 0.55;
        }

        .task:hover .task__star,
        .task:hover .task__del {
            opacity: 1;
        }

        .task__star:hover {
            color: var(--urgent);
        }

        .task__star[aria-pressed="true"] {
            color: var(--urgent);
            opacity: 1;
        }

        .task__del:hover {
            color: var(--ink);
        }

        .empty-state {
            display: none;
            padding: 20px 2px 4px;
            color: var(--ink-faint);
            font-size: 0.92rem;
            font-style: italic;
        }

        .task-list:not(:has(.task))~.empty-state {
            display: block;
        }

        .notes {
            margin-top: 34px;
        }

        .section-label {
            display: block;
            font-size: 0.72rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            color: var(--ink-soft);
            font-weight: 600;
            font-family: ui-monospace, monospace;
            margin-bottom: 10px;
        }

        #notesArea {
            width: 100%;
            min-height: 84px;
            resize: vertical;
            border: none;
            background: transparent;
            background-image: repeating-linear-gradient(var(--surface), var(--surface) 27px, var(--line) 28px);
            color: var(--ink);
            font-size: 0.95rem;
            line-height: 28px;
            padding: 0;
            outline: none;
        }

        #notesArea::placeholder {
            color: var(--ink-faint);
            line-height: 28px;
        }

        .page__footer {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer__group {
            display: flex;
            gap: 18px;
        }

        .ghost-btn {
            border: none;
            background: none;
            color: var(--ink-soft);
            font-family: ui-monospace, monospace;
            font-size: 0.76rem;
            cursor: pointer;
            padding: 4px 2px;
            text-decoration: underline;
            text-decoration-color: var(--line);
            text-underline-offset: 3px;
        }

        .ghost-btn:hover {
            color: var(--urgent);
            text-decoration-color: var(--urgent);
        }

        .ghost-btn:disabled {
            cursor: default;
            color: var(--ink-faint);
            text-decoration-color: transparent;
        }

        @media (max-width: 480px) {
            .page {
                padding: 32px 22px 28px;
            }

            #timeInput {
                width: 62px;
            }

            .dial {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <header>
            <div class="header__text">
                <p class="eyebrow" id="greeting">Buenos días</p>
                <h1 class="date-heading" id="dateHeading">—</h1>
                <p class="day-name" id="dayName">—</p>
            </div>
            <div class="dial-row">
                <div class="dial" id="dial"></div>
                <span class="dial__count" id="progressCount">0/0</span>
            </div>
        </header>

        <div class="sync-row">
            <span class="sync-status"><span class="sync-dot" id="syncDot"></span><span
                    id="syncLabel">Conectando…</span></span>
            <span>Código: <code id="syncCodeText">—</code></span>
            <span class="sync-actions">
                <button type="button" id="copyCodeBtn">Copiar código</button>
                <button type="button" id="joinCodeBtn">Usar otro código</button>
            </span>
        </div>

        <section class="tasks">
            <form class="add-row" id="addForm">
                <input type="text" id="taskInput" placeholder="Añade algo para hoy…" autocomplete="off"
                    maxlength="140" />
                <input type="time" id="timeInput" autocomplete="off" />
                <button type="submit">Añadir</button>
            </form>
            <ul class="task-list" id="taskList"></ul>
            <p class="empty-state" id="emptyState">Nada pendiente todavía. Empieza por lo primero que se te ocurra.</p>
        </section>

        <section class="notes">
            <label class="section-label" for="notesArea">En mente</label>
            <textarea id="notesArea" placeholder="Ideas, recordatorios, cosas que no quieres olvidar…"></textarea>
        </section>

        <footer class="page__footer">
            <div class="footer__group">
                <button class="ghost-btn" id="importBtn" type="button"
                    title="Cargar tareas y notas desde un archivo exportado">Importar</button>
                <button class="ghost-btn" id="exportBtn" type="button"
                    title="Descargar tus tareas y notas en un archivo, como respaldo">Exportar</button>
                <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
            </div>
            <button class="ghost-btn" id="clearDone" type="button">Borrar completadas</button>
        </footer>
    </div>

    <script type="module">
        // ======================================================================
        // 1) CONFIGURA AQUÍ TU PROYECTO FIREBASE
        //    Copia este objeto desde: Firebase Console → ⚙ Configuración del
        //    proyecto → General → "Tus apps" → app web → SDK setup and config.
        //    Es seguro que estos valores queden visibles en el HTML: no son
        //    secretos, son solo el identificador público de tu proyecto.
        // ======================================================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCu9i8OraG5fEcygjFS_v1vMC-cR-eM6G8",
            authDomain: "mi-dia-64c4a.firebaseapp.com",
            projectId: "mi-dia-64c4a",
            storageBucket: "mi-dia-64c4a.firebasestorage.app",
            messagingSenderId: "1011037762631",
            appId: "1:1011037762631:web:1aef38169cae87dfc46d62"
        };
        // ======================================================================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, doc, setDoc, onSnapshot,
            enableIndexedDbPersistence
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        var now = new Date();
        var dateKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
        var localStorageKey = "planner-" + dateKey;

        var hour = now.getHours();
        document.getElementById("greeting").textContent = hour < 12 ? "Buenos días" : hour < 20 ? "Buenas tardes" : "Buenas noches";
        document.getElementById("dateHeading").textContent = now.toLocaleDateString("es-ES", { day: "numeric", month: "long" });
        document.getElementById("dayName").textContent = now.toLocaleDateString("es-ES", { weekday: "long" });

        var state = { tasks: [], notes: "" };
        try {
            var saved = localStorage.getItem(localStorageKey);
            if (saved) state = JSON.parse(saved);
        } catch (e) { }

        var taskList = document.getElementById("taskList");
        var dial = document.getElementById("dial");
        var progressCount = document.getElementById("progressCount");
        var notesArea = document.getElementById("notesArea");
        var taskInput = document.getElementById("taskInput");
        var timeInput = document.getElementById("timeInput");
        var syncDot = document.getElementById("syncDot");
        var syncLabel = document.getElementById("syncLabel");
        var syncCodeText = document.getElementById("syncCodeText");

        notesArea.value = state.notes || "";

        function saveLocal() {
            try { localStorage.setItem(localStorageKey, JSON.stringify(state)); } catch (e) { }
        }

       function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Convierte "14:30", "2:30pm", "9am", etc. a minutos desde medianoche.
// Devuelve null si el texto no se pudo interpretar como hora (o está vacío).
function parseTimeToMinutes(str) {
  if (!str) return null;
  var s = str.trim().toLowerCase().replace(/\./g, "");
  var m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
  if (!m) return null;
  var h = parseInt(m[1], 10);
  var min = m[2] ? parseInt(m[2], 10) : 0;
  var ap = m[3];
  if (ap === "pm" && h < 12) h += 12;
  if (ap === "am" && h === 12) h = 0;
  if (h < 0 || h > 23 || min < 0 || min > 59) return null;
  return h * 60 + min;
}

function byTimeThenOrder(a, b) {
  var ta = parseTimeToMinutes(a.time), tb = parseTimeToMinutes(b.time);
  if (ta === null && tb === null) return a.order - b.order;
  if (ta === null) return 1;
  if (tb === null) return -1;
  return ta - tb || a.order - b.order;
}

function paint() {
  var pending = state.tasks.filter(function (t) { return !t.done; }).sort(byTimeThenOrder);
  var done = state.tasks.filter(function (t) { return t.done; }).sort(byTimeThenOrder);
  var ordered = pending.concat(done);

            taskList.innerHTML = ordered.map(function (t) {
                return '<li class="task' + (t.done ? " task--done" : "") + (t.priority ? " task--priority" : "") + '" data-id="' + t.id + '">' +
                    '<label class="task__box-wrap"><input type="checkbox" class="task__box" ' + (t.done ? "checked" : "") + ' aria-label="Marcar como hecho" /></label>' +
                    '<span class="task__text">' + escapeHtml(t.text) + '</span>' +
                    (t.time ? '<span class="task__time">' + escapeHtml(t.time) + '</span>' : "") +
                    '<span class="task__actions">' +
                    '<button type="button" class="task__star" aria-pressed="' + (t.priority ? "true" : "false") + '" aria-label="Destacar tarea" title="Destacar">&#9679;</button>' +
                    '<button type="button" class="task__del" aria-label="Eliminar tarea" title="Eliminar">&times;</button>' +
                    '</span></li>';
            }).join("");

            var total = state.tasks.length;
            var doneCount = done.length;
            dial.style.setProperty("--pct", total ? Math.round((doneCount / total) * 100) : 0);
            progressCount.textContent = doneCount + "/" + total;
        }

        document.getElementById("addForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var text = taskInput.value.trim();
            if (!text) return;
            state.tasks.push({
                id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
                text: text, time: timeInput.value.trim(), done: false, priority: false, order: state.tasks.length
            });
            taskInput.value = ""; timeInput.value = ""; taskInput.focus();
            commit();
        });

        taskList.addEventListener("click", function (e) {
            var li = e.target.closest(".task");
            if (!li) return;
            var id = li.getAttribute("data-id");
            var task = state.tasks.find(function (t) { return t.id === id; });
            if (!task) return;
            if (e.target.closest(".task__star")) { task.priority = !task.priority; commit(); }
            else if (e.target.closest(".task__del")) { state.tasks = state.tasks.filter(function (t) { return t.id !== id; }); commit(); }
            else { task.done = e.target.classList.contains("task__box") ? e.target.checked : !task.done; commit(); }
        });

        document.getElementById("clearDone").addEventListener("click", function () {
            state.tasks = state.tasks.filter(function (t) { return !t.done; });
            commit();
        });

        notesArea.addEventListener("input", function () {
            state.notes = notesArea.value;
            commitDebounced();
        });

        function flash(btn, msg) {
            var original = btn.textContent;
            btn.textContent = msg; btn.disabled = true;
            setTimeout(function () { btn.textContent = original; btn.disabled = false; }, 1800);
        }

        // ---- Exportar / Importar (respaldo manual, funciona en cualquier navegador) ----
        var exportBtn = document.getElementById("exportBtn");
        var importBtn = document.getElementById("importBtn");
        var importFile = document.getElementById("importFile");

        exportBtn.addEventListener("click", function () {
            var payload = JSON.stringify({ tasks: state.tasks, notes: state.notes, date: dateKey, exportedAt: new Date().toISOString() }, null, 2);
            if (window.claude && window.claude.downloads) {
                window.claude.downloads.save({ filename: "tu-dia-" + dateKey + ".json", data: payload })
                    .then(function () { flash(exportBtn, "Exportado ✓"); })
                    .catch(function (err) { if (!(err && err.code === "declined")) flash(exportBtn, "No se pudo exportar"); });
            } else {
                var blob = new Blob([payload], { type: "application/json" });
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url; a.download = "tu-dia-" + dateKey + ".json";
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                flash(exportBtn, "Exportado ✓");
            }
        });

        importBtn.addEventListener("click", function () { importFile.click(); });
        importFile.addEventListener("change", function () {
            var file = importFile.files && importFile.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function () {
                try {
                    var incoming = JSON.parse(String(reader.result));
                    mergeState(incoming);
                    commit();
                    flash(importBtn, "Importado ✓");
                } catch (e) { flash(importBtn, "Archivo no válido"); }
                importFile.value = "";
            };
            reader.onerror = function () { flash(importBtn, "No se pudo leer"); };
            reader.readAsText(file);
        });

        function mergeState(incoming) {
            var incomingTasks = Array.isArray(incoming.tasks) ? incoming.tasks : [];
            var existingIds = {};
            state.tasks.forEach(function (t) { existingIds[t.id] = true; });
            var offset = state.tasks.length;
            incomingTasks.forEach(function (t, i) {
                if (!t || typeof t.text !== "string" || !t.text.trim()) return;
                if (t.id && existingIds[t.id]) return;
                state.tasks.push({
                    id: t.id || (Date.now() + "-" + Math.random().toString(36).slice(2, 7)),
                    text: t.text.slice(0, 140), time: typeof t.time === "string" ? t.time.slice(0, 12) : "",
                    done: !!t.done, priority: !!t.priority, order: offset + i
                });
            });
            if (typeof incoming.notes === "string" && incoming.notes.trim()) {
                if (!state.notes || !state.notes.trim()) state.notes = incoming.notes;
                else if (state.notes.indexOf(incoming.notes) === -1) state.notes = state.notes + "\n\n" + incoming.notes;
                notesArea.value = state.notes;
            }
        }

        // ======================================================================
        // 2) SINCRONIZACIÓN ENTRE DISPOSITIVOS (Firebase Firestore)
        //    Todos los dispositivos que usen el MISMO "código" comparten los
        //    mismos datos del día en tiempo real.
        // ======================================================================
        var CODE_KEY = "tu-dia-sync-code";
        function randomCode() {
            var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            var out = "";
            for (var i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];
            return out;
        }
        var syncCode = localStorage.getItem(CODE_KEY);
        if (!syncCode) { syncCode = randomCode(); localStorage.setItem(CODE_KEY, syncCode); }
        syncCodeText.textContent = syncCode;

        document.getElementById("copyCodeBtn").addEventListener("click", function () {
            navigator.clipboard.writeText(syncCode).then(function () {
                flash(document.getElementById("copyCodeBtn"), "Copiado ✓");
            }).catch(function () { });
        });
        document.getElementById("joinCodeBtn").addEventListener("click", function () {
            var input = prompt("Escribe el código que se muestra en tu otro dispositivo:", syncCode);
            if (!input) return;
            var clean = input.trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
            if (clean.length < 6) { alert("Código no válido."); return; }
            localStorage.setItem(CODE_KEY, clean);
            location.reload();
        });

        var db = null, docRef = null, remoteReady = false, applyingRemote = false;
        var isConfigured = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("PEGA_AQUI") === -1;

        if (!isConfigured) {
            syncDot.className = "sync-dot err";
            syncLabel.textContent = "Sin configurar (solo local)";
        } else {
            try {
                var app = initializeApp(FIREBASE_CONFIG);
                db = getFirestore(app);
                try { enableIndexedDbPersistence(db); } catch (e) { }
                docRef = doc(db, "planners", syncCode, "days", dateKey);

                syncDot.className = "sync-dot";
                syncLabel.textContent = "Conectando…";

                onSnapshot(docRef, function (snap) {
                    remoteReady = true;
                    syncDot.className = "sync-dot ok";
                    syncLabel.textContent = "Sincronizado";
                    if (snap.exists()) {
                        var remote = snap.data();
                        applyingRemote = true;
                        state = { tasks: remote.tasks || [], notes: remote.notes || "" };
                        notesArea.value = state.notes;
                        saveLocal();
                        paint();
                        applyingRemote = false;
                    } else {
                        // No hay nada remoto todavía: sube lo que tengas en local.
                        pushRemote();
                    }
                }, function (err) {
                    syncDot.className = "sync-dot err";
                    syncLabel.textContent = "Error de sincronización";
                    console.error("Firestore error:", err);
                });
            } catch (e) {
                syncDot.className = "sync-dot err";
                syncLabel.textContent = "Error de configuración";
                console.error(e);
            }
        }

        var pushTimer = null;
        function pushRemote() {
            if (!docRef) return;
            setDoc(docRef, { tasks: state.tasks, notes: state.notes, updatedAt: Date.now() }, { merge: false })
                .catch(function (err) { console.error("No se pudo guardar en la nube:", err); });
        }
        function commit() {
            saveLocal();
            paint();
            if (applyingRemote) return;
            pushRemote();
        }
        function commitDebounced() {
            saveLocal();
            if (applyingRemote) return;
            clearTimeout(pushTimer);
            pushTimer = setTimeout(pushRemote, 500);
        }

        paint();
    </script>

</body>

</html>
